# The Windows build (MSYS2 UCRT64, GCC): every push and pull request builds it, runs the tests
# and keeps Lost_Paradise-windows.zip as a workflow artifact (the run's Summary page).
name: Windows
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Import names
        run: scripts/fetch-nids.sh aerolib.csv
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DLPN_VERSION="${GITHUB_REF_NAME//\//-}"
          ninja -C build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Zip
        run: scripts/make-windows-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lost_Paradise-windows
          path: build/zip/

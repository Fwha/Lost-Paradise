# Pushing a tag such as v0.2.0 builds the launcher AppImage (and the Windows zip) and publishes
# them as that release,
# which the launcher's Check for updates then offers (src/launcher/updater.h).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-dev glslang-tools libsdl2-dev zlib1g-dev
      - name: Import names and DLSS SDK
        run: |
          scripts/fetch-nids.sh aerolib.csv
          scripts/fetch-dlss.sh
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DLPN_VERSION="${GITHUB_REF_NAME}"
          ninja -C build
          ctest --test-dir build --output-on-failure
      - name: AppImage
        run: scripts/make-appimage.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/Lost_Paradise-x86_64.AppImage --title "${GITHUB_REF_NAME}" --generate-notes
  # The Windows zip, added to the same release (the launcher's update on Windows looks for an
  # asset ending in -windows.zip).
  windows:
    needs: appimage
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # The runner's own MSYS2 (C:\msys64): downloading the installer has failed with 504s.
          release: false
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Build
        run: |
          scripts/fetch-nids.sh aerolib.csv
          cmake -S . -B build -G Ninja -DLPN_VERSION="${GITHUB_REF_NAME}"
          ninja -C build
          ctest --test-dir build --output-on-failure
          scripts/make-windows-zip.sh
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" build/Lost_Paradise-windows.zip --clobber
